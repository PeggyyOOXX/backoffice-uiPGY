        const first=controls[0],last=controls.at(-1);
        if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus()}
        else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus()}

            `<div class="affix-input"><span>⌕</span><input class="guide-input" value="ava_chen"><span>×</span></div>`,
          ],
          [
            "密碼",
            "登入密碼、交易密碼及確認密碼。",
            `<div class="affix-input"><input class="guide-input" type="password" value="password"><span>◉</span></div>`,
          ],
          [
            "數字／金額",
            "金額、比率、權重與上下限。",
            `<div class="amount-range-control"><input class="guide-input" placeholder="最低"><span>～</span><input class="guide-input" placeholder="最高"></div>`,
          ],
          [
            "前綴／後綴",
            "幣別、百分比及固定單位。",
            `<div class="affix-input"><span>$</span><input class="guide-input" value="1,200"><span>%</span></div>`,
          ],
          [
            "Textarea",
            "備註、描述、拒絕原因與訊息內容。",
            `<textarea class="guide-input guide-textarea" placeholder="請輸入備註"></textarea>`,
          ],
          [
            "單選下拉 Select",
            "狀態、等級、平台、語言與類型。",
            `<select class="guide-input standard-select"><option>請選擇</option><option>啟用</option><option>停用</option></select>`,
          ],
          [
            "可搜尋／可清除下拉",
            "代理、遊戲供應商、會員標籤等大量選項。",
            `<div class="affix-input"><span>⌕</span><input class="guide-input" placeholder="搜尋並選擇"><span>⌄</span></div>`,
          ],
          [
            "多選下拉",
            "會員標籤、語言、遊戲分類與批次條件。",
            `<div class="affix-input"><span style="background:#e8f4f5;border-radius:4px">VIP 1 ×</span><input class="guide-input" placeholder="新增"></div>`,
          ],
          [
            "日期 Date Picker",
            "單日、開始日與結束日。",
            `<div class="affix-input"><span>▣</span><input class="guide-input" value="2026-09-16"></div>`,
          ],
          [
            "日期時間範圍",
            "報表、註冊時間、登入時間與活動期間。",
            `<div class="affix-input"><span>▣</span><input class="guide-input" value="09-01 ～ 09-16"></div>`,
          ],
          [
            "Radio 單選",
            "互斥設定、審核方式與活動機制。",
            `<div class="standard-choice-row"><label><input type="radio" checked> 固定值</label><label><input type="radio"> 百分比</label></div>`,
          ],
          [
            "Checkbox 複選",
            "欄位啟用、批次選取與條件設定。",
            `<div class="standard-choice-row"><label><input type="checkbox" checked> 手機</label><label><input type="checkbox"> Email</label></div>`,
          ],
          [
            "Switch 開關",
            "功能啟閉、前台顯示及自動刷新。",
            `<div class="settings-row"><button type="button" role="switch" aria-checked="true" data-switch-layout-demo class="standard-switch" aria-label="已開啟"></button><span>已開啟</span></div>`,
          ],
          [
            "檔案／圖片上傳",
            "Logo、Banner、遊戲圖片與附件。",
            `<div class="standard-upload">＋ 點擊或拖曳上傳</div>`,
          ],
          [
            "富文字編輯器",
            "公告、文章、活動規則與站內訊息。",
            `<div class="standard-editor">B　I　U　≡<br><br>請輸入內容…</div>`,
          ],
        ]
          .map(
            (item) =>
              `<article class="card input-standard-card"><h3>${item[0]}</h3><p>${item[1]}</p><div class="input-demo-row"><div><label>Desktop · 34px</label>${item[2]}</div><div class="input-demo-mobile"><label>Mobile · 同元件規格</label>${item[2]}</div></div></article>`,
          )
          .join("")}
      </section>
      <section class="card input-standard-tokens"><h2>共用規格</h2><table><thead><tr><th>項目</th><th>Desktop</th><th>Mobile</th><th>原則</th></tr></thead><tbody><tr><td>Input 高度</td><td>34px</td><td>34px</td><td>外觀一致；複雜觸控元件可增加外部點擊區</td></tr><tr><td>字級／字重</td><td>14px / 400</td><td>14px / 400</td><td>Label 12px，Placeholder 不取代 Label</td></tr><tr><td>左右內距</td><td>9–10px</td><td>9–10px</td><td>箭頭及尾綴固定距右側 9px</td></tr><tr><td>圓角</td><td>7px</td><td>7px</td><td>所有文字、數字、日期及 Select 統一</td></tr><tr><td>狀態</td><td colspan="2">Default / Hover / Focus / Filled / Disabled / Readonly / Error / Loading</td><td>錯誤不可只靠顏色，必須附文字</td></tr></tbody></table></section>`;
      const routes = {
        樣式規範: ["樣式規範", "設計系統 / 元件規範", buttonGuide],
        組件範例: ["組件範例", "組件範例", componentExamples],
        搜尋結果頁面: [
          "搜尋結果頁面",
          "搜尋結果頁面",
          () => originalMemberPage,
        ],
        設定相關頁面: ["設定相關頁面", "設定相關頁面", () => window.renderSettingsPage()],
        審核操作: ["審核操作", "審核操作", () => window.renderAuditPage()],
        複雜設定: ["複雜設定", "複雜設定", () => window.renderComplexSettings()],
        批量開關: ["批量開關", "批量開關", () => window.renderBulkSwitch()],
        內容編輯: ["內容編輯", "內容編輯", () => window.renderContentEditor()],
        下拉選單: ["下拉選單 Select", "設計系統 / 元件規範", () => window.renderSelectAdvanced()],
        頁籤: ["頁籤 Tabs", "設計系統 / 元件規範", () => window.renderTabsGuide()],
        載入與空狀態: ["載入與空狀態", "設計系統 / 元件規範", () => window.renderStateGuide()],
        第三層: ["第三層", "第一層 / 第二層 / 第三層", finance],
      };
      document.querySelectorAll(".nav-item").forEach((item) => {
        if (item.dataset.toggle) return;
        const key =
          item.dataset.routeKey ||
          Object.keys(routes).find((k) => item.textContent.includes(k));
        if (!key) return;
        item.style.cursor = "pointer";
        item.onclick = () => {
          document
            .querySelectorAll(".nav-item")
            .forEach((n) => n.classList.remove("active"));
          item.classList.add("active");
          const r = routes[key];
          shellTitle.textContent = r[0];
          pageEl.innerHTML = r[2]();
          sidebar.classList.remove("mobile-open");
          sideBackdrop.classList.remove("show");
          window.scrollTo({ top: 0, behavior: "smooth" });
        };
        item.addEventListener("click", () => setActiveQuickTab(key));
      });
      document.querySelectorAll("[data-toggle]").forEach((item) =>
        item.addEventListener("click", () => {
          const target =
            item.dataset.toggle === "finance-tree"
              ? item.closest(".nav-tree")
              : item.nextElementSibling;
          if (!target) return;
          target.classList.toggle("is-open");
          item.classList.toggle(
            "expanded",
            target.classList.contains("is-open"),
          );
        }),
      );
      function setActiveQuickTab(key) {
        document
          .querySelectorAll("#quickTabs button")
          .forEach((b) => b.classList.toggle("active", b.dataset.page === key));
      }
      document.querySelector("#quickTabs").addEventListener("click", (e) => {
        const close = e.target.closest("span");
        const button = e.target.closest("button");
        if (!button) return;
        if (close) {
          e.stopPropagation();
          const wasActive = button.classList.contains("active");
          button.remove();
          if (wasActive)
            document
              .querySelector('#quickTabs button[data-page="樣式規範"]')
              ?.click();
          return;
        }
        const key = button.dataset.page;
        setActiveQuickTab(key);
        const nav = [...document.querySelectorAll(".nav-item")].find(
          (n) =>
            n.dataset.routeKey === key ||
            (!n.dataset.toggle && n.textContent.includes(key)),
        );
        nav?.click();
      });
      // 樣式規範 is the landing page; the member page above only ran so its markup
      // could be captured for the 搜尋結果頁面 route.
      shellTitle.textContent = routes["樣式規範"][0];
      pageEl.innerHTML = routes["樣式規範"][2]();
    </script>
    <script type="module" src="/date-picker.js"></script>
    <script type="module" src="/select.js"></script>
  <script type="module" src="/settings-demo.js"></script>
</body>
</html>
